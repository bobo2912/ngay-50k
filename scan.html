<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quét mã QR</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<script src="vendor/jsQR.js"></script>
<script>
/* Trang con chỉ dùng để mở camera. Khi quét xong hoặc đóng, trang cha xoá hẳn khung này,
   nên iOS chắc chắn giải phóng camera. */
(function(){
  var post = function(m){ m.src = "ngay50k-scan"; try{ parent.postMessage(m, location.origin); }catch(e){} };
  var stream = null, timer = null, done = false;
  var v = document.getElementById("v");
  var c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently:true });
  function stop(){
    clearTimeout(timer); timer = null;
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    try{ v.pause(); }catch(e){}
    v.srcObject = null;
  }
  function loop(){
    timer = setTimeout(function(){
      if(!stream || done) return;
      if(v.readyState >= 2 && v.videoWidth){
        try{
          var vw = v.videoWidth, vh = v.videoHeight, side = Math.min(vw, vh) * 0.8;
          var sx = (vw - side) / 2, sy = (vh - side) / 2, out = Math.min(560, Math.round(side));
          c.width = out; c.height = out;
          ctx.drawImage(v, sx, sy, side, side, 0, 0, out, out);
          var r = window.jsQR(ctx.getImageData(0, 0, out, out).data, out, out, { inversionAttempts:"dontInvert" });
          if(r && r.data){ done = true; stop(); post({ type:"qr", data:r.data }); return; }
        }catch(e){}
      }
      loop();
    }, 120);
  }
  function start(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ post({ type:"error", name:"NotSupported" }); return; }
    navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } } })
      .then(function(st){
        stream = st; v.srcObject = st;
        var p = v.play(); if(p && p.catch) p.catch(function(){});
        var tr = st.getVideoTracks()[0], caps = tr && tr.getCapabilities ? tr.getCapabilities() : {};
        post({ type:"ready", torch: !!caps.torch });
        loop();
      })
      .catch(function(e){ post({ type:"error", name:(e && e.name) || "Error" }); });
  }
  window.addEventListener("message", function(e){
    if(e.origin !== location.origin) return;
    var m = e.data || {};
    if(m.type === "stop") stop();
    if(m.type === "start" && !stream){ done = false; start(); }
    if(m.type === "torch" && stream){
      var tr = stream.getVideoTracks()[0];
      tr.applyConstraints({ advanced:[{ torch: !!m.on }] })
        .then(function(){ post({ type:"torch", on: !!m.on }); })
        .catch(function(){ post({ type:"torch", on:false, fail:true }); });
    }
  });
  window.addEventListener("pagehide", stop);
  document.addEventListener("visibilitychange", function(){ if(document.hidden) stop(); });
  if(!window.jsQR) post({ type:"error", name:"NoDecoder" }); else start();
})();
</script>
</body>
</html>
